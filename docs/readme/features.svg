<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#fbfaf6"/>
  <g font-family="'DejaVu Sans', sans-serif">
    <rect x="24" y="24" width="564" height="220" rx="18" fill="#ffffff" stroke="#e6e2d6"/>
    <text x="52" y="72" font-size="22" font-weight="700" fill="#1a1a17">Rendered, immediately</text>
    <text x="52" y="110" font-size="16" fill="#46453d">Headings, tasks, callouts, code,</text>
    <text x="52" y="134" font-size="16" fill="#46453d">tables, math, and Mermaid.</text>
    <rect x="52" y="164" width="220" height="44" rx="10" fill="#e7f0fc"/>
    <text x="72" y="192" font-size="15" fill="#0a4ea3">GitHub Flavored Markdown</text>

    <rect x="612" y="24" width="564" height="220" rx="18" fill="#ffffff" stroke="#e6e2d6"/>
    <text x="640" y="72" font-size="22" font-weight="700" fill="#1a1a17">Edit the live file</text>
    <text x="640" y="110" font-family="'DejaVu Sans Mono', monospace" font-size="15" fill="#46453d">edit_document replaces one exact</text>
    <text x="640" y="134" font-size="16" fill="#46453d">match. save true writes the file.</text>
    <rect x="640" y="164" width="360" height="44" rx="10" fill="#1a1a17"/>
    <text x="656" y="192" font-family="'DejaVu Sans Mono', monospace" font-size="14" fill="#ffffff">find once, then replace</text>

    <rect x="24" y="268" width="564" height="220" rx="18" fill="#ffffff" stroke="#e6e2d6"/>
    <text x="52" y="316" font-size="22" font-weight="700" fill="#1a1a17">Export from the app</text>
    <text x="52" y="354" font-size="16" fill="#46453d">PDF, Word, HTML, and EPUB.</text>
    <text x="52" y="378" font-size="16" fill="#46453d">Open the file in Read view first.</text>
    <rect x="52" y="408" width="70" height="36" rx="8" fill="#0969da"/>
    <text x="87" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">PDF</text>
    <rect x="134" y="408" width="86" height="36" rx="8" fill="#e7f0fc"/>
    <text x="177" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#0a4ea3">DOCX</text>
    <rect x="232" y="408" width="86" height="36" rx="8" fill="#e7f0fc"/>
    <text x="275" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#0a4ea3">HTML</text>

    <rect x="612" y="268" width="564" height="220" rx="18" fill="#16181d"/>
    <text x="640" y="316" font-size="22" font-weight="700" fill="#ffffff">Human review</text>
    <text x="640" y="354" font-family="'DejaVu Sans Mono', monospace" font-size="15" fill="#c9ced6">request_review blocks until the</text>
    <text x="640" y="378" font-size="16" fill="#c9ced6">person approves, asks for changes,</text>
    <text x="640" y="402" font-size="16" fill="#c9ced6">or dismisses. The verdict is JSON.</text>
    <rect x="640" y="432" width="250" height="32" rx="8" fill="#1f3d2a"/>
    <text x="656" y="454" font-family="'DejaVu Sans Mono', monospace" font-size="14" fill="#3fb950">"verdict": "approved"</text>
  </g>
</svg>
