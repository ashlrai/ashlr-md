[package]
name = "mdopener-mcp"
version = "0.4.0"
description = "MCP (Model Context Protocol) server for MD Opener: lets coding agents drive the app"
authors = ["MD Opener contributors"]
license = "MIT"
edition = "2021"

[[bin]]
name = "mdopener-mcp"
path = "src/main.rs"

[lib]
name = "mdopener_mcp"
path = "src/lib.rs"

[dependencies]
# JSON-RPC serialisation / deserialisation.
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Percent-encode paths for mdopener:// URLs.
urlencoding = "2"

# Resolve ~ in paths.
dirs = "5"

# O_NOFOLLOW / O_NONBLOCK for document reads (already in the tree via dirs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Create temporary files in integration tests without touching the filesystem
# after the test completes.
tempfile = "3"
