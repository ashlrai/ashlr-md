# Publishes the GitHub Release for one verified assembly. It never creates or moves a tag.
name: Publish verified release

on:
  workflow_run:
    workflows: ["Assemble verified MD updater staging"]
    types: [completed]

permissions: {}

concurrency:
  group: release-publish-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'ashlrai/ashlr-md' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout the workflow revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install the pinned Python toolchain
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef736b477958d2f6b77e69e246c2316c992f5 # 1.99.1
        with:
          toolchain: '1.99.1'

      - name: Download the verified assembly
        env:
          ASSEMBLE_RUN_ID: ${{ github.event.workflow_run.id }}
          ASSEMBLE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          test "$ASSEMBLE_ATTEMPT" = 1
          gh run download "$ASSEMBLE_RUN_ID" --repo ashlrai/ashlr-md \
            --name "ashlr-md-assembly-${ASSEMBLE_RUN_ID}-${ASSEMBLE_ATTEMPT}" \
            --dir "$RUNNER_TEMP/staging"

      - name: Publish the verified assembly
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: '1'
          GITHUB_REPOSITORY: ${{ github.repository }}
          ASSEMBLE_RUN_ID: ${{ github.event.workflow_run.id }}
          ASSEMBLE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/publish-verified-release.py \
            --assemble-run-id "$ASSEMBLE_RUN_ID" \
            --assemble-attempt "$ASSEMBLE_ATTEMPT" \
            --staging "$RUNNER_TEMP/staging"
