name: Release assembly dispatch

# Removes the human dispatch of release-assemble.yml. When a Release build for
# an exact vX.Y.Z tag completes successfully on attempt 1, and the tagged
# commit has a successful full CI run (canonical push to main or manual
# dispatch), this job dispatches release-assemble.yml on main with the same
# inputs docs/RELEASING.md lists. The Release build may be a tag push or a
# main-only workflow_dispatch of release.yml for an existing tag. Both the
# tag-push path and the dispatch path peel an anchored git/ref, including an
# annotated tag, to source_sha. A dispatch run's head SHA is the workflow
# revision on main, not the tag. It uses the workflow GITHUB_TOKEN, so the
# dispatched run belongs to github-actions[bot], not a maintainer account.
# release-assemble.yml keeps its read-only contract and every input check.
# This job never checks out code, never reads secrets and cannot publish.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions: {}

concurrency:
  group: md-release-assemble-dispatch-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'ashlrai/ashlr-md' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EVENT: ${{ github.event.workflow_run.event }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Validate the release build and CI, then dispatch assembly
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::invalid run id"; exit 1; }
          # Anchored git/ref peel. expected is the pushed commit or the prepare sha.
          peel_release_tag() {
            local expected="$1" ref_json
            ref_json=$(gh api "repos/$REPO/git/ref/tags/$RELEASE_TAG")
            SOURCE_SHA=$(printf '%s' "$ref_json" | REPO="$REPO" RELEASE_TAG="$RELEASE_TAG" PREPARE_SHA="$expected" python3 -c 'import json,os,re,subprocess,sys; repo=os.environ["REPO"]; tag=os.environ["RELEASE_TAG"]; prepare=os.environ["PREPARE_SHA"]; gh=lambda path: json.loads(subprocess.check_output(["gh","api","repos/%s/%s"%(repo,path)])); ref=json.load(sys.stdin); sys.exit("tag ref mismatch") if ref.get("ref")!="refs/tags/%s"%tag else exec("obj=ref.get(\"object\") or {}\nseen=set()\nfor _ in range(6):\n kind,sha=obj.get(\"type\"),obj.get(\"sha\")\n if kind==\"commit\":\n  sys.exit(\"peeled tag does not match the prepare sha\") if not (re.fullmatch(r\"[0-9a-f]{40}\", sha or \"\") and sha==prepare) else print(sha)\n  break\n if kind!=\"tag\" or sha in seen or not re.fullmatch(r\"[0-9a-f]{40}\", sha or \"\"): sys.exit(\"invalid annotated tag\")\n seen.add(sha); obj=(gh(\"git/tags/\"+sha).get(\"object\") or {})\nelse: sys.exit(\"tag chain too deep\")")')
            [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid source sha"; exit 1; }
          }
          if [ "$EVENT" = push ]; then
            RELEASE_TAG="$HEAD_BRANCH"
            if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::notice::$RELEASE_TAG is not an exact stable tag; no assembly dispatch"
              exit 0
            fi
            [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid source sha"; exit 1; }
            peel_release_tag "$HEAD_SHA"
            run=$(gh api "repos/$REPO/actions/runs/$RELEASE_RUN_ID" \
              --jq '[.path, .event, .conclusion, (.run_attempt|tostring), .head_sha] | join(" ")')
            test "$run" = ".github/workflows/release.yml push success 1 $SOURCE_SHA" || { echo "::error::release run mismatch"; exit 1; }
          elif [ "$EVENT" = workflow_dispatch ]; then
            test "$HEAD_BRANCH" = main || { echo "::error::workflow_dispatch release must run from main"; exit 1; }
            [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid workflow revision sha"; exit 1; }
            mkdir -p "$RUNNER_TEMP/release-binding"
            gh run download "$RELEASE_RUN_ID" --repo "$REPO" --name release-binding --dir "$RUNNER_TEMP/release-binding"
            read -r RELEASE_TAG PREPARE_SHA < <(python3 -c 'import json,re,sys; p=json.load(open(sys.argv[1])); tag,sha,version=p.get("tag"),p.get("sha"),p.get("version"); ok=p.get("event")=="workflow_dispatch" and p.get("inputs_version")==version and isinstance(tag,str) and re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) and version==tag[1:] and isinstance(sha,str) and re.fullmatch(r"[0-9a-f]{40}", sha); sys.exit("prepare binding does not match this dispatch") if not ok else print(tag, sha)' "$RUNNER_TEMP/release-binding/release-binding.json")
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::prepare tag is not an exact stable tag"; exit 1; }
            peel_release_tag "$PREPARE_SHA"
            run=$(gh api "repos/$REPO/actions/runs/$RELEASE_RUN_ID" \
              --jq '[.path, .event, .conclusion, (.run_attempt|tostring), .head_branch, .head_sha] | join(" ")')
            test "$run" = ".github/workflows/release.yml workflow_dispatch success 1 main $HEAD_SHA" || { echo "::error::release run mismatch"; exit 1; }
          else
            echo "::error::unsupported release event"; exit 1
          fi
          export SOURCE_SHA RELEASE_TAG
          # A missing release is a 404. Any other API failure stops the dispatch.
          read_github_record() {
            local endpoint="$1" label="$2" err raw http_status body status
            err="$RUNNER_TEMP/gh-read-record.err"
            set +e
            raw=$(gh api -i "$endpoint" 2>"$err")
            status=$?
            set -e
            # The status is the second token of the HTTP status line, and only
            # a three-digit code counts. A 500 body that mentions 404 is not a 404.
            http_status=$(printf '%s\n' "$raw" | tr -d '\r' | awk 'NR==1 && $1 ~ /^HTTP\// { print $2; exit }')
            case "$http_status" in
              [0-9][0-9][0-9]) ;;
              *) http_status="" ;;
            esac
            body=$(printf '%s\n' "$raw" | tr -d '\r' | awk 'BEGIN{header=1} header && NF==0 {header=0; next} !header {print}')
            if [ "$status" -eq 0 ]; then
              printf '%s' "$body"
              return 0
            fi
            if [ "$http_status" = 404 ]; then
              return 2
            fi
            echo "::error::could not read $label" >&2
            return 1
          }
          release_status=0
          release_json=$(read_github_record "repos/$REPO/releases/tags/$RELEASE_TAG" "the GitHub Release for $RELEASE_TAG") || release_status=$?
          if [ "$release_status" -eq 0 ]; then
            draft=$(printf '%s' "$release_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("draft"))')
            test "$draft" = True || { echo "::error::$RELEASE_TAG is already published"; exit 1; }
          elif [ "$release_status" -ne 2 ]; then
            exit 1
          fi
          latest_status=0
          latest_json=$(read_github_record "repos/$REPO/releases/latest" "the latest GitHub Release") || latest_status=$?
          if [ "$latest_status" -eq 0 ]; then
            printf '%s' "$latest_json" | RELEASE_TAG="$RELEASE_TAG" python3 -c 'import json,os,re,sys; tag=os.environ["RELEASE_TAG"]; latest=json.load(sys.stdin).get("tag_name"); parse=lambda value: tuple(int(part) for part in value[1:].split(".")) if isinstance(value,str) and re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", value) else sys.exit("latest release is not a stable tag"); sys.exit("version is not strictly greater than the latest release") if parse(tag)<=parse(latest) else None' || { echo "::error::version is not strictly greater than the latest release"; exit 1; }
          elif [ "$latest_status" -ne 2 ]; then
            exit 1
          fi
          ok=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.head_sha == env.SOURCE_SHA and ((.event == "push" and .head_branch == "main") or .event == "workflow_dispatch"))] | length')
          test "$ok" -ge 1 || { echo "::error::no successful full CI run for $SOURCE_SHA"; exit 1; }
          publication_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run release-assemble.yml --repo "$REPO" --ref main \
            -f release_tag="$RELEASE_TAG" -f source_sha="$SOURCE_SHA" \
            -f release_run_id="$RELEASE_RUN_ID" -f release_run_attempt=1 \
            -f publication_date="$publication_date"
