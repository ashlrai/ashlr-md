name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same PR; never cancel main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Linux: the fast gate. All OS-agnostic JS quality gates (typecheck, Biome,
  # unit tests, frontend build), dependency audits, and a Linux Rust check.
  # Moved here from macOS: identical coverage on a runner ~10x cheaper, and
  # lint/type errors now fail in ~2 min without waiting on a Mac.
  # ---------------------------------------------------------------------------
  check-linux:
    name: Check (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Biome)
        run: bunx biome check src

      - name: Unit tests
        run: bun run test

      # Soft-gated so an upstream advisory annotates without blocking.
      - name: Audit JS dependencies
        run: bun audit
        continue-on-error: true

      - name: Frontend build
        run: bunx vite build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches ~/.cargo AND src-tauri/target (previously only the registry was
      # cached, so every run recompiled the whole Tauri tree).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri 2 Linux prerequisites — required for tauri-build to compile.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Stub sidecar binaries (resource existence check)
        run: |
          mkdir -p src-tauri/target/release
          touch src-tauri/target/release/mdopen \
                src-tauri/target/release/mdopener-mcp

      - name: Rust check (workspace)
        run: cargo check --workspace --manifest-path src-tauri/Cargo.toml

      # Cargo.lock is platform-independent, so the CVE audit runs once here
      # (prebuilt binary, seconds) instead of `cargo install` on macOS.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
        continue-on-error: true

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # macOS: only what needs macOS — the macOS-target Rust check and clippy
  # (Swift/AFM sidecars, macOS-only cfg code). JS gates run on Linux above.
  # ---------------------------------------------------------------------------
  check-macos:
    name: Check (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build validates bundle.resources paths exist at compile time.
      - name: Stub sidecar binaries (resource existence check)
        run: |
          mkdir -p src-tauri/target/release
          touch src-tauri/target/release/mdopen \
                src-tauri/target/release/mdopener-mcp \
                src-tauri/target/release/mdopener-afm \
                src-tauri/target/release/mdopener-setdefault
          # The frontend is built on Linux; give tauri's context codegen a
          # placeholder frontendDist so the macOS Rust check stays standalone.
          mkdir -p dist && [ -f dist/index.html ] || echo '<!doctype html>' > dist/index.html

      - name: Rust check (workspace)
        run: cargo check --workspace --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy (workspace)
        run: cargo clippy --workspace --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
