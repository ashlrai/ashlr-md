name: CI

# One required aggregate check: Check (Linux). Pull requests run fast
# typecheck, Biome, unit tests, crypto policy and pinned diff secret scans; merge queue
# stays fast too. Full Linux/macOS suites validate every post-merge main push
# plus daily/manual runs, and their aggregate fails on any required failure.
# Codecov uploads stay daily/manual only; full suites do not block merging.
# Run scripts/ci-local.sh before pushing.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main]
  schedule:
    # Daily full suite at 04:23 ET (08:23 UTC), staggered from the other repos'
    # daily runs so the macOS job does not queue behind them (RQ-DAILY-15).
    - cron: "23 8 * * *"
  workflow_dispatch:

# Cancel superseded PR runs; never cancel a queue or scheduled run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast:
    name: Typecheck, lint, unit tests, crypto policy
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          # Its post step saves the Bun binary. Fork pull requests restore only.
          no-cache: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      # Fork pull requests restore only. Same-repo pull requests, merge_group
      # and push may save a new key. A failed save does not fail the job.
      - name: Restore Bun install cache
        id: bun-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Save Bun install cache
        if: steps.bun-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Biome)
        run: bunx biome check src

      - name: CI gate regression tests
        run: node --test scripts/ci/gate.test.mjs scripts/ci/release-gate.test.mjs scripts/ci/assembly-workflow.test.mjs scripts/ci/select.test.mjs scripts/ci/first-failure.test.mjs scripts/ci/release-asset.test.mjs scripts/ci/os-gate.test.mjs scripts/ci/suite-failure.test.mjs
      - name: Dependency plan parser regressions
        run: |
          python3 scripts/test-apt-dependency-plan.py
          python3 scripts/test-apt-https-sources.py
          python3 scripts/test-prefetch-tauri-bundler-tools.py
          python3 scripts/ci/apt-budget.test.py
          python3 scripts/ci/refresh-apt-green-runs.test.py

      - name: Unit tests
        run: bun run test:unit

      - name: Check npm script file paths
        run: node --test scripts/package-scripts.test.mjs

      - name: Check documentation links
        run: bun run check:doc-links

      # Tauri's version (bundle + updater) must match package.json.
      - name: Tauri and package.json versions match
        run: bun run check:version

      # bash -n every bash/sh run block in .github/workflows; catches syntax
      # errors (e.g. an unclosed quote) before merge, which Actions only
      # surfaces at run time on the runner.
      - name: Workflow run-block syntax
        run: bun run check:workflow-bash

      # Tier-1 security check, pre-merge on every PR and queue run.
      - name: Crypto policy check
        run: bun run check:crypto

      # Existing supply-chain step, unchanged (soft-gated so an upstream
      # advisory annotates without blocking). Seconds, so it runs every time.
      - name: Audit JS dependencies
        run: bun audit
        continue-on-error: true

  secret-scan:
    # Security floor: diff-only secret scan on every event, pinned Gitleaks
    # 8.30.0 (sha256-verified). No path filter and no if-condition; the gate
    # fails unless this job succeeds (skipped or cancelled fails closed).
    name: Secret scan (diff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version
      - name: Scan the commits this event adds
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$(git merge-base "$PR_BASE" "$HEAD_SHA")" ;;
            merge_group) base="$MG_BASE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base="${HEAD_SHA}~1"; fi
          # A PR must not allowlist its own leak: ignore any repo-supplied config.
          rm -f .gitleaks.toml .gitleaksignore
          echo "scanning ${base}..${HEAD_SHA}"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --log-opts="${base}..${HEAD_SHA}" --redact --no-banner --max-target-megabytes 5 --timeout 120

  linux-full:
    name: Linux full suite
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Runs bun install and tests (third-party code), so no id-token here.
    # The Codecov OIDC uploads live in the daily/manual-only codecov job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Biome)
        run: bunx biome check src

      # Run the suite once with lcov and JUnit on every full-suite event;
      # fail if either report is missing.
      - name: Unit tests
        id: unit
        run: |
          set -euo pipefail
          set +e
          ./node_modules/.bin/vitest run --coverage --coverage.reporter=lcov --bail=1 --reporter=default --reporter=junit --reporter=json --outputFile.junit=junit.xml --outputFile.json=vitest-results.json
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            node scripts/ci/suite-failure.mjs vitest-results.json
            exit "$status"
          fi
          for f in coverage/lcov.info junit.xml; do
            if [ ! -s "$f" ]; then echo "::error::missing $f after coverage run"; exit 1; fi
          done

      - name: Keep coverage reports for the Codecov job
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (steps.unit.outcome == 'success' || steps.unit.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            coverage/lcov.info
            junit.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Frontend build
        run: bunx vite build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      # The release-assembly validator uses Python's stdlib tomllib (3.11+).
      - name: Set up Python for release validator tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Test release assembly validator
        run: |
          python3 scripts/test-release-provenance.py
          python3 scripts/test-prepare-release-assembly.py
          python3 scripts/test-release-archive.py
          python3 scripts/test-assemble-updater.py
          cargo test --locked --manifest-path scripts/release-signature-check/Cargo.toml

      # Caches ~/.cargo AND src-tauri/target (previously only the registry was
      # cached, so every run recompiled the whole Tauri tree).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      # The wall budget and the idle-output cap are computed from
      # scripts/ci/apt-green-runs.json (the trailing green install steps).
      - name: Install Linux system dependencies
        run: python3 scripts/ci/apt-budget.py

      - name: Stub sidecar binaries (resource existence check)
        run: |
          mkdir -p src-tauri/target/release
          touch src-tauri/target/release/mdopen \
                src-tauri/target/release/mdopener-mcp
          # tauri's context codegen needs frontendDist; the vite build only runs
          # when frontend inputs changed, so keep a placeholder like macOS does.
          mkdir -p dist && [ -f dist/index.html ] || echo '<!doctype html>' > dist/index.html

      - name: Rust check (workspace)
        run: cargo check --workspace --manifest-path src-tauri/Cargo.toml

      # Linux-target clippy catches non-macOS cfg rot (dead code off macOS)
      # that the macOS clippy cannot see. Only when Rust inputs changed (the
      # classifier's `macos` output), or when the classifier did not succeed.
      - name: Rust clippy (workspace, Linux)
        run: cargo clippy --workspace --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Full workspace tests (Linux): md-opener lib incl. local_inference gate
      # tests, mdopener-mcp local_inference_probe, handshake_conformance (#178
      # kit) and doctor_fix. Queue and pre-flip PRs when Rust inputs changed;
      # nightly/manual always.
      - name: Rust tests (workspace)
        run: cargo test --workspace --manifest-path src-tauri/Cargo.toml -- --test-threads=2

      # Cargo.lock is platform-independent, so the CVE audit runs once here
      # (prebuilt binary, seconds) instead of `cargo install` on macOS.
      - name: Install cargo-audit
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-audit
        continue-on-error: true

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
        continue-on-error: true

  codecov:
    name: Codecov upload
    needs: linux-full
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download coverage reports
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports

      - name: Upload coverage to Codecov
        if: steps.dl.outcome == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage/lcov.info

      - name: Upload test results to Codecov
        if: steps.dl.outcome == 'success'
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: junit.xml

  macos-full:
    name: macOS full suite
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      # tauri-build validates bundle.resources paths exist at compile time.
      - name: Stub sidecar binaries (resource existence check)
        run: |
          mkdir -p src-tauri/target/release
          touch src-tauri/target/release/mdopen \
                src-tauri/target/release/mdopener-mcp \
                src-tauri/target/release/mdopener-afm \
                src-tauri/target/release/mdopener-setdefault
          # The frontend is built on Linux; give tauri's context codegen a
          # placeholder frontendDist so the macOS Rust check stays standalone.
          mkdir -p dist && [ -f dist/index.html ] || echo '<!doctype html>' > dist/index.html

      - name: Rust check (workspace)
        run: cargo check --workspace --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy (workspace)
        run: cargo clippy --workspace --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  secret-shape:
    # Security floor: pinned scrub.pl (sha256 5aa902ab) over the added lines of
    # the candidate diff, on every event. No if and no paths filter; the gate
    # fails closed unless this job succeeds.
    name: Secret-shape scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Scan candidate diff (fail closed)
        env:
          SCRUB_SHA256: 5aa902abedbb3bf7fa8d893b93969e247c82ff62ac26cd082215caabfb740265
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "${SCRUB_SHA256}  .github/tests/secret-shape/scrub.pl" | sha256sum --check --strict
          if [ -z "${BASE_SHA}" ]; then BASE_SHA="$(git rev-parse "${HEAD_SHA}^1")"; fi
          base="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          git diff --no-color --no-ext-diff "${base}" "${HEAD_SHA}" > "${RUNNER_TEMP}/candidate.diff"
          perl .github/tests/secret-shape/scrub.pl --check --allow-fixtures < "${RUNNER_TEMP}/candidate.diff"

  # The one required check. Every event needs the fast job and the secret
  # scan; main push, scheduled and dispatch runs need both full-suite jobs. Any
  # needed job that is not success (failure, cancelled or skipped) fails it.
  gate:
    name: Check (Linux)
    if: always()
    needs: [fast, secret-scan, linux-full, macos-full, secret-shape]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every needed job
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Defense in depth for the main-only push trigger.
          if [ "$EVENT" = "push" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::unexpected non-main push"; exit 1
          fi
          # Exact dependency keys: a missing or extra job fails closed.
          printf '%s' "$NEEDS" | jq -e --argjson exp "[\"fast\", \"linux-full\", \"macos-full\", \"secret-scan\", \"secret-shape\"]" '(keys | sort) == $exp' > /dev/null || { echo "::error::gate dependency inventory changed"; exit 1; }
          full=false
          if [ "$EVENT" = "push" ] || [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then full=true; fi
          bad="$(printf '%s' "$NEEDS" | jq -r --argjson full "$full" 'to_entries[] | select(.value.result != "success") | select(($full | not) and (.key == "linux-full" or .key == "macos-full") and .value.result == "skipped" | not) | "\(.key)=\(.value.result)"')"
          if [ -n "$bad" ]; then echo "::error::Check (Linux): $bad"; exit 1; fi
          echo "Check (Linux) passed ($EVENT)"

  fixup-queue:
    # Daily red run -> READY FIXUP lines for the router queue (fix-forward owner:
    # ci-efficiency). One line per failed job from the needs context only: no
    # logs or env, read-only token, passed through the pinned scrub.pl.
    name: Daily fixup queue
    needs: [fast, secret-scan, linux-full, codecov, macos-full, secret-shape, gate]
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout scrubber
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/tests/secret-shape/scrub.pl
          sparse-checkout-cone-mode: false
      - name: Build fixup-queue.txt
        env:
          NEEDS: ${{ toJSON(needs) }}
          SCRUB_SHA256: 5aa902abedbb3bf7fa8d893b93969e247c82ff62ac26cd082215caabfb740265
        run: |
          set -euo pipefail
          echo "${SCRUB_SHA256}  .github/tests/secret-shape/scrub.pl" | sha256sum --check --strict
          sha7="${GITHUB_SHA:0:7}"
          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '%s' "$NEEDS" | jq -r --arg sha7 "$sha7" --arg run "$run" --arg repo "ashlr-md" --arg up "$(echo ashlr-md | tr a-z- A-Z-)" '
            [to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | to_entries[] |
            "- READY RQ-FIXUP-\($up)-\($sha7)-\(.key + 1) (P0, pool=any, repo=\($repo), lead=CI-Efficiency, owner=ci-efficiency, job=\(.value.key), result=\(.value.value.result), run=\($run), sha=\($sha7)): daily full suite job \(.value.key) concluded \(.value.value.result); first error is in the run'"'"'s failed step."' > raw.txt
          perl .github/tests/secret-shape/scrub.pl < raw.txt > fixup-queue.txt
          echo "fixup_lines=$(wc -l < fixup-queue.txt)"
          cat fixup-queue.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fixup queue
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ashlr-md-fixup-queue
          path: fixup-queue.txt
          if-no-files-found: error
          retention-days: 7

  classify:
    name: Classify OS checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_os: ${{ steps.sel.outputs.run_os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide whether Windows and macOS legs run
        id: sel
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: node scripts/ci/select.mjs --os-gate --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"

  os-windows:
    name: Typecheck, lint, unit tests (windows)
    needs: classify
    if: needs.classify.outputs.run_os == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Restore Bun install cache
        id: bun-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Save Bun install cache
        if: steps.bun-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
      - name: Typecheck, lint, and the unit tests this diff affects
        env:
          OS_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/ci/first-failure.mjs

  os-macos:
    name: Typecheck, lint, unit tests (macos)
    needs: classify
    if: needs.classify.outputs.run_os == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
          no-cache: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Restore Bun install cache
        id: bun-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Save Bun install cache
        if: steps.bun-cache.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
      - name: Typecheck, lint, and the unit tests this diff affects
        env:
          OS_TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/ci/first-failure.mjs

  install-smoke-linux:
    name: install smoke (linux)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
