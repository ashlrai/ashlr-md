name: CI

# Merge-queue CI (pilot). Until the repo variable MERGE_QUEUE is 'true' (set
# when the ruleset enables the queue), PRs and main pushes run the selected
# suite exactly as before, so nothing merges on the fast lane alone.
# With MERGE_QUEUE=true: PR pushes, drafts included, get a fast typecheck and
# lint under both required names. The full selected suite runs once, in the
# merge queue (merge_group), on the batched merge commit. Nightly and manual
# runs do everything on Linux and macOS. Main pushes run nothing: every commit
# on main already passed its merge_group run. Run scripts/ci-local.sh before
# pushing.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Cancel superseded PR runs; never cancel a queue or nightly run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # What the merge_group run needs (impact selection). PRs need no
  # classification (fast lane only); nightly and manual runs select everything.
  #   js:    frontend inputs changed (unit tests, build)
  #   macos: Rust inputs changed (Linux and macOS cargo check and clippy)
  #   docs-only merges run nothing but the always-on security checks.
  # docs/AGENTS.md is include_str!'d by an mdopener-mcp test, so it is a Rust input.
  # ---------------------------------------------------------------------------
  changes:
    name: Classify changes
    if: github.event_name != 'push' || vars.MERGE_QUEUE != 'true'
    runs-on: ubuntu-22.04
    env:
      SELECT: ${{ github.event_name == 'merge_group' || (github.event_name == 'pull_request' && vars.MERGE_QUEUE != 'true') }}
    outputs:
      js: ${{ steps.classify.outputs.js }}
      macos: ${{ steps.classify.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        if: env.SELECT == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          FAST: ${{ github.event_name == 'pull_request' && vars.MERGE_QUEUE == 'true' }}
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$FAST" = true ]; then echo "js=false" >> "$GITHUB_OUTPUT"; echo "macos=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "$EVENT" in
            merge_group|pull_request) ;;
            *) echo "js=true" >> "$GITHUB_OUTPUT"; echo "macos=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          files="$(git diff --name-only "$BASE...$HEAD")"
          printf '%s\n' "$files"
          not_rust='^(src/|landing/|samples/|integrations/|index\.html$|biome\.json$|vite\.config\.ts$|vitest\.config\.ts$|tsconfig(\.node)?\.json$|package\.json$|bun\.lockb?$|[^/]*\.md$|docs/)'
          js_in='^(src/|index\.html$|biome\.json$|vite\.config\.ts$|vitest\.config\.ts$|tsconfig(\.node)?\.json$|package\.json$|bun\.lockb?$|\.github/workflows/|scripts/)'
          macos=false; js=false
          if printf '%s\n' "$files" | grep -v '^docs/AGENTS\.md$' | grep -Ev "$not_rust" | grep -q .; then macos=true; fi
          if printf '%s\n' "$files" | grep -qx 'docs/AGENTS.md'; then macos=true; fi
          if printf '%s\n' "$files" | grep -Eq "$js_in"; then js=true; fi
          echo "js=$js" >> "$GITHUB_OUTPUT"; echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "js=$js macos=$macos"

  # ---------------------------------------------------------------------------
  # Linux. PR: typecheck + Biome only (~1 min, cached). merge_group: the
  # selected suite plus the always-on security checks (crypto policy, audits).
  # Nightly/manual: everything.
  # ---------------------------------------------------------------------------
  check-linux:
    name: Check (Linux)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'push' || vars.MERGE_QUEUE != 'true') }}
    runs-on: ubuntu-22.04
    # Runs bun install and tests (third-party code), so no id-token here.
    # The Codecov OIDC uploads live in the merge_group-only codecov job.
    permissions:
      contents: read
    env:
      # Fast lane: PR events once the merge queue is on.
      PR: ${{ github.event_name == 'pull_request' && vars.MERGE_QUEUE == 'true' }}
      # A failed classifier selects everything.
      JS: ${{ needs.changes.result != 'success' || needs.changes.outputs.js == 'true' }}
      RUST: ${{ needs.changes.result != 'success' || needs.changes.outputs.macos == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Biome)
        run: bunx biome check src

      # Same tests as before. merge_group calls vitest directly (no `--`
      # forwarding) to add lcov and JUnit, so the suite still runs once, and
      # fails if either report is missing. Other events stay on bun run test.
      - name: Unit tests
        id: unit
        if: env.PR != 'true' && env.JS == 'true'
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            ./node_modules/.bin/vitest run --coverage --coverage.reporter=lcov --reporter=default --reporter=junit --outputFile=junit.xml
            for f in coverage/lcov.info junit.xml; do
              if [ ! -s "$f" ]; then echo "::error::missing $f after coverage run"; exit 1; fi
            done
          else
            bun run test
          fi

      - name: Keep coverage reports for the Codecov job
        if: ${{ !cancelled() && github.event_name == 'merge_group' && env.JS == 'true' && (steps.unit.outcome == 'success' || steps.unit.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            coverage/lcov.info
            junit.xml
          if-no-files-found: ignore
          retention-days: 1

      # Soft-gated so an upstream advisory annotates without blocking.
      # Always-on security check in the queue (not previously in CI).
      - name: Crypto policy check
        if: env.PR != 'true'
        run: bun run check:crypto

      - name: Audit JS dependencies
        if: env.PR != 'true'
        run: bun audit
        continue-on-error: true

      - name: Frontend build
        if: env.PR != 'true' && env.JS == 'true'
        run: bunx vite build

      - name: Install Rust
        if: env.PR != 'true' && env.RUST == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Caches ~/.cargo AND src-tauri/target (previously only the registry was
      # cached, so every run recompiled the whole Tauri tree).
      - uses: Swatinem/rust-cache@v2
        if: env.PR != 'true' && env.RUST == 'true'
        with:
          workspaces: src-tauri

      # Tauri 2 Linux prerequisites — required for tauri-build to compile.
      - name: Install Linux system dependencies
        if: env.PR != 'true' && env.RUST == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Stub sidecar binaries (resource existence check)
        if: env.PR != 'true' && env.RUST == 'true'
        run: |
          mkdir -p src-tauri/target/release
          touch src-tauri/target/release/mdopen \
                src-tauri/target/release/mdopener-mcp

      - name: Rust check (workspace)
        if: env.PR != 'true' && env.RUST == 'true'
        run: cargo check --workspace --manifest-path src-tauri/Cargo.toml

      # Linux-target clippy catches non-macOS cfg rot (dead code off macOS)
      # that the macOS clippy cannot see. Only when Rust inputs changed (the
      # classifier's `macos` output), or when the classifier did not succeed.
      - name: Rust clippy (workspace, Linux)
        if: env.PR != 'true' && env.RUST == 'true'
        run: cargo clippy --workspace --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Cargo.lock is platform-independent, so the CVE audit runs once here
      # (prebuilt binary, seconds) instead of `cargo install` on macOS.
      - name: Install cargo-audit
        if: env.PR != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
        continue-on-error: true

      - name: Audit Rust dependencies
        if: env.PR != 'true'
        run: cargo audit --file src-tauri/Cargo.lock
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Codecov uploads (merge_group only). The only job with id-token: write, and
  # it runs no repo or dependency code: it only downloads the reports from
  # Check (Linux) and hands them to the pinned Codecov actions over OIDC.
  # Not a required check.
  # ---------------------------------------------------------------------------
  codecov:
    name: Codecov upload
    needs: check-linux
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download coverage reports
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports

      - name: Upload coverage to Codecov
        if: steps.dl.outcome == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage/lcov.info

      - name: Upload test results to Codecov
        if: steps.dl.outcome == 'success'
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: junit.xml

  # ---------------------------------------------------------------------------
  # macOS: only what needs macOS — the macOS-target Rust check and clippy
  # (Swift/AFM sidecars, macOS-only cfg code). JS gates run on Linux above.
  # ---------------------------------------------------------------------------
  check-macos:
    name: Check (macOS)
    needs: changes
    # Always reports the required name. On PRs, and in the queue when no Rust
    # input changed, it is a seconds-long Linux stub; otherwise it runs the
    # macOS check. A failed classifier runs it on macOS.
    if: ${{ !cancelled() && (github.event_name != 'push' || vars.MERGE_QUEUE != 'true') }}
    runs-on: ${{ ((github.event_name == 'pull_request' && vars.MERGE_QUEUE == 'true') || (needs.changes.result == 'success' && needs.changes.outputs.macos != 'true')) && 'ubuntu-22.04' || 'macos-14' }}
    steps:
      - name: Stub (no macOS inputs in this run)
        if: runner.os != 'macOS'
        run: echo "No Rust inputs selected; macOS check not needed for this event."

      - uses: actions/checkout@v4
        if: runner.os == 'macOS'
        with:
          persist-credentials: false

      - name: Install Rust
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'macOS'
        with:
          workspaces: src-tauri

      # tauri-build validates bundle.resources paths exist at compile time.
      - name: Stub sidecar binaries (resource existence check)
        if: runner.os == 'macOS'
        run: |
          mkdir -p src-tauri/target/release
          touch src-tauri/target/release/mdopen \
                src-tauri/target/release/mdopener-mcp \
                src-tauri/target/release/mdopener-afm \
                src-tauri/target/release/mdopener-setdefault
          # The frontend is built on Linux; give tauri's context codegen a
          # placeholder frontendDist so the macOS Rust check stays standalone.
          mkdir -p dist && [ -f dist/index.html ] || echo '<!doctype html>' > dist/index.html

      - name: Rust check (workspace)
        if: runner.os == 'macOS'
        run: cargo check --workspace --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy (workspace)
        if: runner.os == 'macOS'
        run: cargo clippy --workspace --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
