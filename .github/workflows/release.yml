name: Release

# Triggers on any tag that starts with "v" (e.g. v0.1.0, v1.2.3-beta.1).
# Also runs on workflow_dispatch (auto-tag.yml fallback and the manual path):
#   gh workflow run release.yml -R ashlrai/ashlr-md -f version=X.Y.Z
# The tag vX.Y.Z must already exist; the build checks out that tag's commit,
# never the dispatch ref.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z); tag vX.Y.Z must already exist"
        required: true
        type: string

# Only one release can be in-flight at a time for a given tag.
concurrency:
  group: release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    # Resolve the tag to the commit that is built and gated. A tag push uses
    # its own tag; a dispatch names the tag through the version input, which
    # must be strict X.Y.Z and must already exist as vX.Y.Z.
    name: Resolve release tag
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve tag to commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must match X.Y.Z"; exit 1; }
            tag="v${INPUT_VERSION}"
          else
            tag="$REF_NAME"
          fi
          sha="$(gh api "repos/${REPO}/commits/refs/tags/${tag}" --jq '.sha')" || { echo "::error::tag ${tag} does not exist"; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve ${tag}"; exit 1; }
          if [ "$EVENT" = push ] && [ "$sha" != "$EVENT_SHA" ]; then
            echo "::error::tag ${tag} resolves to ${sha}, not the pushed ${EVENT_SHA}"; exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          persist-credentials: false

      - name: Require version carriers to equal the tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, tomllib
          want = os.environ["TAG"].removeprefix("v")
          got = {
              "package.json": json.load(open("package.json"))["version"],
              "src-tauri/tauri.conf.json": json.load(open("src-tauri/tauri.conf.json"))["version"],
              "src-tauri/Cargo.toml": tomllib.load(open("src-tauri/Cargo.toml", "rb"))["package"]["version"],
          }
          bad = {k: v for k, v in got.items() if v != want}
          if bad:
              raise SystemExit(f"::error::version does not match tag {want}: {bad}")
          print("version carriers match", want)
          PY

  full-suite-evidence:
    # Release gate: the full suite (macOS and Windows included) must have
    # passed in a CI run on this exact sha: either a manual workflow_dispatch
    # run, or the post-merge push-to-main run, which executes the same
    # linux-full and macos-full suites.
    name: Full suite green on release sha
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - name: Require a successful workflow_dispatch CI run on this sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.prepare.outputs.sha }}
          CI_WORKFLOW: ci.yml
        run: |
          set -euo pipefail
          n=0
          for event in workflow_dispatch push; do
            c="$(gh api "repos/${REPO}/actions/workflows/${CI_WORKFLOW}/runs?event=${event}&head_sha=${SHA}&status=success&per_page=1" --jq '.total_count')"
            n=$((n + ${c:-0}))
          done
          if [ "$n" -lt 1 ]; then
            echo "::error::No successful workflow_dispatch or push run of ${CI_WORKFLOW} on ${SHA}. Wait for the push-to-main CI run to go green, or run 'gh workflow run ${CI_WORKFLOW} --ref <this ref>', then release."
            exit 1
          fi
          echo "full suite green on ${SHA} (${n} run(s))"

  # ---------------------------------------------------------------------------
  # Build matrix: macOS (aarch64 + x86_64), Linux (x86_64), Windows (x86_64).
  #
  # Each runner:
  #   1. Builds its platform-specific sidecars:
  #        macOS  → all 4 (2 Rust + 2 Swift) via scripts/build-sidecars.sh
  #        Linux  → 2 Rust sidecars via scripts/build-sidecars.sh
  #        Windows→ 2 Rust sidecars via `cargo build` directly (no bash)
  #   2. Runs `tauri build` via tauri-action, which RFC-7396-merges the
  #      platform-specific overlay so only the sidecars that exist on that OS
  #      are included in the bundle:
  #        tauri.macos.conf.json   → mdopen, mdopener-mcp, mdopener-afm, mdopener-setdefault
  #        tauri.linux.conf.json   → mdopen, mdopener-mcp
  #        tauri.windows.conf.json → mdopen.exe, mdopener-mcp.exe
  #   3. Uploads per-platform workflow artifacts for manual assembly.
  #      No GitHub Release or updater manifest is created by this workflow.
  #
  # Apple signing/notarization is gated behind HAS_APPLE_SIGNING so the
  # macOS job still succeeds on forks without certificates.
  # ---------------------------------------------------------------------------
  release:
    needs: [prepare, full-suite-evidence]
    name: Build & release (${{ matrix.platform }})
    permissions:
      contents: write   # Required to create / update the GitHub Release

    strategy:
      fail-fast: false
      matrix:
        include:
          # ------------------------------------------------------------------
          # macOS arm64 (primary shipping target, Apple Silicon)
          # ------------------------------------------------------------------
          - platform: macos-15
            rust-target: aarch64-apple-darwin
            tauri-args: "--target aarch64-apple-darwin"
            build-sidecars: "bash scripts/build-sidecars.sh"
            os: macOS

          # ------------------------------------------------------------------
          # macOS x86_64 (Intel Macs)
          # ------------------------------------------------------------------
          - platform: macos-15-intel
            rust-target: x86_64-apple-darwin
            tauri-args: "--target x86_64-apple-darwin"
            build-sidecars: "bash scripts/build-sidecars.sh"
            os: macOS

          # ------------------------------------------------------------------
          # Linux x86_64 (AppImage + deb)
          # ------------------------------------------------------------------
          - platform: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            tauri-args: ""
            build-sidecars: "bash scripts/build-sidecars.sh"
            os: Linux

          # ------------------------------------------------------------------
          # Windows x86_64 (NSIS installer)
          # ------------------------------------------------------------------
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            tauri-args: ""
            # Use cargo directly — Windows runners do not have bash in PATH by
            # default and there are no Swift sidecars to build on Windows.
            build-sidecars: >-
              cargo build --release
              --manifest-path src-tauri/Cargo.toml
              -p mdopen
              -p mdopener-mcp
            os: Windows

    runs-on: ${{ matrix.platform }}

    # Surface the Apple signing secret as an env var so steps can gate on it.
    env:
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      # ---- Toolchain setup -------------------------------------------------

      # Select the latest available Xcode on macOS runners.
      # -----------------------------------------------------------------------
      # mdopener-afm requires Xcode 26 / Swift 6.2+ and the macOS 26 SDK.
      # Native macos-15 (ARM) and macos-15-intel images provide Xcode 26;
      # "latest" avoids their older default Xcode. Keep each host native:
      # build-sidecars.sh builds Rust and Swift helpers for the host architecture.
      # Check each build's selected Xcode and sidecar output; resource
      # reconciliation below preserves the existing best-effort Swift behavior.
      # -----------------------------------------------------------------------
      - name: Select latest Xcode (macOS only)
        if: matrix.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.rust-target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust-target }}-cargo-

      # ---- Linux system dependencies (Tauri 2 prerequisites) ---------------
      # Package list from https://v2.tauri.app/start/prerequisites/

      - name: Install Linux system dependencies
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # ---- JS dependencies -------------------------------------------------

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # ---- Sidecar binaries ------------------------------------------------
      # macOS/Linux: runs build-sidecars.sh which detects the OS and builds
      #   accordingly (all 4 on macOS, 2 Rust-only on Linux).
      # Windows: cargo build directly (no bash; Swift N/A on Windows).

      - name: Build sidecar binaries
        run: ${{ matrix.build-sidecars }}

      # Mark Rust sidecar binaries executable (macOS/Linux only)
      - name: Mark sidecar binaries executable
        if: matrix.os != 'Windows'
        run: |
          chmod +x src-tauri/target/release/mdopen
          chmod +x src-tauri/target/release/mdopener-mcp
          # Swift sidecars are best-effort (need Xcode 26); chmod only if present.
          chmod +x src-tauri/target/release/mdopener-afm 2>/dev/null || true
          chmod +x src-tauri/target/release/mdopener-setdefault 2>/dev/null || true

      # The macOS Swift sidecars (afm, setdefault) need the macOS 26 SDK. When
      # the runner's Xcode can't build them, drop them from bundle.resources so
      # `tauri build` still succeeds — the app degrades gracefully at runtime
      # (Apple on-device AI falls back to Ollama/cloud; native set-default
      # reports unavailable). A full-featured macOS build is produced on a real
      # macOS 26 machine.
      - name: Reconcile macOS bundle resources to what built
        if: matrix.os == 'macOS'
        run: |
          python3 - <<'PY'
          import json, os
          p = "src-tauri/tauri.macos.conf.json"
          with open(p) as f:
              cfg = json.load(f)
          res = cfg.get("bundle", {}).get("resources", {})
          kept = {k: v for k, v in res.items() if os.path.exists(os.path.join("src-tauri", k))}
          dropped = sorted(set(res) - set(kept))
          if dropped:
              print("Dropping sidecar resources that did not build:", dropped)
          cfg["bundle"]["resources"] = kept
          with open(p, "w") as f:
              json.dump(cfg, f, indent=2)
          PY

      # ---- Apple code signing (macOS only, gated on secret) ----------------

      - name: Import Apple certificate
        if: matrix.os == 'macOS' && env.HAS_APPLE_SIGNING != ''
        env:
          APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID:                   ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD:             ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Expose notarization creds to the build step ONLY when signing is
          # configured. They must be ABSENT (not empty) for an unsigned build, or
          # Tauri attempts notarization and fails on the empty Team ID.
          {
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # ---- Tauri build + GitHub Release ------------------------------------
      # tauri-action auto-detects the platform config overlay.
      # No tagName or releaseId is supplied; tauri-action does not create
      # a Release or updater manifest in this build-only invocation.

      # Build only — we do NOT publish from CI. The release is assembled and published
      # with a maintainer's credentials from the per-platform artifacts uploaded
      # below. Omitting tagName makes tauri-action build without touching the
      # release API. Updater signing runs for eligible updater artifacts;
      # assembly must still verify the actual inventory and signatures.
      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          # Apple signing / notarization (macOS only). When no Developer ID is
          # configured, fall back to ad-hoc signing ("-") so the macOS bundle
          # still builds (unsigned/un-notarized) instead of failing codesign with
          # an empty identity. A real identity (when the secret is set) takes over.
          APPLE_SIGNING_IDENTITY:     ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID are intentionally NOT set
          # here — the "Import Apple certificate" step injects them via $GITHUB_ENV
          # only when a Developer ID is configured. Setting them to empty strings
          # would make Tauri attempt (and fail) notarization on an unsigned build.
          # Tauri updater signing key (cross-platform — required on all legs)
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args:          ${{ matrix.tauri-args }}

      # Upload the built bundles (installers + updater .sig) as workflow
      # artifacts. This uses the Actions runtime token (not GITHUB_TOKEN), so it
      # works regardless of the org's read-only workflow-token policy.
      - name: Upload bundle artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/*/release/bundle/**/*

      # ---- Cleanup ---------------------------------------------------------

      - name: Clean up keychain
        if: always() && matrix.os == 'macOS' && env.HAS_APPLE_SIGNING != ''
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
