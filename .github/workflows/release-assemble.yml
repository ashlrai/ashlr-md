name: Assemble verified MD updater staging

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag
        required: true
        type: string
      source_sha:
        description: Exact reviewed source commit
        required: true
        type: string
      release_run_id:
        description: Successful original push release build run
        required: true
        type: string
      release_run_attempt:
        description: Original build attempt (only 1 is supported)
        required: true
        default: '1'
        type: string
      publication_date:
        description: Intended publication UTC time YYYY-MM-DDTHH:MM:SSZ
        required: true
        type: string

      apt_plan_only:
        description: Compare the fixed Linux dependency simulations only (assembly inputs are unused)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: md-updater-assembly
  cancel-in-progress: false

jobs:
  assemble:
    if: github.repository == 'ashlrai/ashlr-md' && github.ref == 'refs/heads/main' && !inputs.apt_plan_only
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}
      PUBLICATION_DATE: ${{ inputs.publication_date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - name: Verify assembly input and archive regressions
        run: |
          python3 scripts/test-prepare-release-assembly.py
          python3 scripts/test-release-provenance.py
          python3 scripts/test-release-archive.py
          python3 scripts/test-assemble-updater.py
      - name: Download original source-bound artifact ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/prepare-release-assembly.py \
            --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" \
            --run-id "$RELEASE_RUN_ID" --run-attempt "$RELEASE_RUN_ATTEMPT"
      - name: Install pinned inspection tools
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/md-assembly-venv"
          "$RUNNER_TEMP/md-assembly-venv/bin/pip" install --require-hashes --only-binary=:all: -r scripts/release-assembly-requirements.txt
          mkdir -m 700 "$RUNNER_TEMP/md-assembly-tools"
          curl --fail --silent --show-error --location --proto '=https' --max-time 120 \
            'https://github.com/ip7z/7zip/releases/download/26.05/7z2605-linux-x64.tar.xz' \
            --output "$RUNNER_TEMP/md-assembly-tools/7zip.tar.xz"
          printf '%s  %s\n' '22cf82fcc6eb7474f1d5bb4f02c0f8ebd573a718089d6833dc30f8350a3b232e' "$RUNNER_TEMP/md-assembly-tools/7zip.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/md-assembly-tools/7zip.tar.xz" -C "$RUNNER_TEMP/md-assembly-tools" 7zz
          printf '%s  %s\n' 'd32657a7a0e4cdc0a8aa57cafe474746944d76e861e753e9c902b9c9356fa886' "$RUNNER_TEMP/md-assembly-tools/7zz" | sha256sum --check --strict
          chmod 700 "$RUNNER_TEMP/md-assembly-tools/7zz"
      - name: Assemble and verify all four updater payloads
        env:
          ASHLR_MD_7ZZ: ${{ runner.temp }}/md-assembly-tools/7zz
        run: |
          "$RUNNER_TEMP/md-assembly-venv/bin/python" scripts/assemble-updater.py \
            "$RUNNER_TEMP/md-original-zips" hosted-release \
            --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" \
            --run-id "$RELEASE_RUN_ID" --pub-date "$PUBLICATION_DATE"
      # Upload staging only after the strict live proof, signature, platform,
      # inventory and no-replace checks pass. This job cannot publish a release.
      - name: Upload verified staging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ashlr-md-assembly-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-staging/hosted-release/
          if-no-files-found: error
          retention-days: 7

  apt-plan:
    name: Read-only Linux dependency plan
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.apt_plan_only &&
      github.repository == 'ashlrai/ashlr-md' && github.ref == 'refs/heads/main' && github.ref_protected &&
      github.workflow_ref == 'ashlrai/ashlr-md/.github/workflows/release-assemble.yml@refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify dependency plan regressions
        run: python3 scripts/test-apt-dependency-plan.py
      - name: Refresh package metadata only
        timeout-minutes: 3
        run: |
          set -euo pipefail
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_opts[@]}" update
      - name: Simulate both fixed dependency plans without installing
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_SHA,ImageOS,ImageVersion python3 scripts/apt-dependency-plan.py > "$RUNNER_TEMP/md-apt-plan.json"
          cat "$RUNNER_TEMP/md-apt-plan.json"
      - name: Upload dependency measurement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ashlr-md-apt-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/md-apt-plan.json
          if-no-files-found: error
          retention-days: 7
