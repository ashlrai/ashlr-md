# Automatic Analysis only. No workflow and no token.
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
sonar.organization=ashlrai
sonar.projectKey=ashlrai_ashlr-md

# Directories only. Wildcards are not valid on sources or tests.
sonar.sources=src,integrations,landing,scripts,src-tauri
sonar.tests=src,integrations,scripts,src-tauri

# Colocated Vitest files and Rust tests/ directories.
# Test inclusions are also applied as source exclusions.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/tests/**

# Generated, vendored, dist, and fixture paths.
sonar.exclusions=**/dist/**,**/dist-ssr/**,**/node_modules/**,**/target/**,**/gen/**,**/.build/**,integrations/obsidian/main.js,integrations/obsidian/main.js.map,src/lib/__fixtures__/**,src-tauri/bins/mdopener-mcp/tests/contract/**
sonar.test.exclusions=src/lib/__fixtures__/**,src-tauri/bins/mdopener-mcp/tests/contract/**
